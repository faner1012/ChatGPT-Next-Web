name: Upstream Sync

permissions:
  contents: write  # 显式声明拥有仓库写权限

on:
  schedule:
    - cron: "0 * * * *"  # 每小时自动同步一次
  workflow_dispatch:     # 支持手动点击触发同步

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # 1. 检出你自己的仓库代码
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取全部历史提交，防止合并失败

      # 2. 运行纯 Git 命令完成同步
      - name: Sync upstream changes
        run: |
          # 配置自动化机器人身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 添加原作者的官方仓库作为上游
          git remote add upstream https://github.com
          
          # 抓取原作者最新代码
          git fetch upstream main
          
          # 强行合并
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "🔄 自动同步上游最新代码"
          
          # 💡 关键修复：利用加密令牌强行推送到你自己的 origin 仓库
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git main
